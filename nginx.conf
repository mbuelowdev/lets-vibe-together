server {
    listen 0.0.0.0:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Godot 4 threaded web exports need SharedArrayBuffer.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Never HTTP-cache the export. Filenames are stable (index.wasm, index.pck),
    # so a cached copy would keep serving a previous deploy.
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/wasm application/octet-stream application/json;

    location ~* \.pck$ {
        default_type application/octet-stream;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
